id = "lemminx-xacro"
name = "Xacro"
version = "0.0.1"
schema_version = 1
authors = ["Justin Lopato <justin@lopa.to>"]
description = "Provides Xacro/URDF language support via Eclipse LemMinX."
repository = "https://github.com/lopatoj/lemminx-xacro"

# Same tree-sitter XML grammar (and revision) as the zed-xml extension.
[grammars.xml]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-xml"
rev = "5000ae8f22d11fbe93939b05c1e37cf21117162d"
path = "xml"

# Stock Eclipse LemMinX (Java) with the lemminx-xacro jar on its classpath.
# Registered only for the Xacro language (*.xacro, *.urdf), so plain *.xml files keep using
# the zed-xml extension's native LemMinX and the two servers never run on the same file.
[language_servers.lemminx-xacro]
name = "LemMinX (xacro)"
languages = ["Xacro"]

[language_servers.lemminx-xacro.language_ids]
Xacro = "xml"
